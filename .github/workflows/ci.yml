name: Java 21 - build et tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compiler et executer tous les tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
      - name: Conserver les resultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: target/surefire-reports/
          if-no-files-found: ignore
